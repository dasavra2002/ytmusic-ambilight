name: Automated Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Syntax Linting
      run: npm run lint

    - name: Build Distribution Packages
      run: npm run build

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/ytmusic-ambilight.zip
          dist/ytmusic-ambilight.xpi
          dist/ytmusic-ambilight.user.js
        generate_release_notes: true
